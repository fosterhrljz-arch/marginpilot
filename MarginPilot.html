 methods, delete the old entries in Records first; the day needs rechecking."],["\u6210\u672C\u53EF\u4EE5\u7A0D\u540E\u8865","Add costs later","\u5FEB\u901F\u8BB0\u4E00\u5929\u9ED8\u8BA4\u53EA\u9700\u65E5\u671F\u548C\u6536\u5165\u3002\u9009\u62E9\u300C\u7A0D\u540E\u8865\u6210\u672C\u300D\u4FDD\u5B58\uFF0C\u5B8C\u6574\u5229\u6DA6\u663E\u793A\u5F85\u8865\u5168\u3002\u5728\u6536\u652F\u660E\u7EC6\u7684\u6BCF\u65E5\u9500\u552E\u5408\u8BA1\u4E2D\u70B9\u300C\u8865\u6210\u672C\u300D\uFF0C\u586B\u597D\u5DF2\u552E\u6210\u672C\u5E76\u9009\u62E9\u6838\u5B9E\u72B6\u6001\uFF0C\u518D\u4FDD\u5B58\u539F\u8BB0\u5F55\uFF0C\u4E0D\u91CD\u590D\u8BB0\u6536\u5165\u3002","Quick daily entry starts with just a date and revenue. Save with Add costs later; full profit stays Incomplete. In Records \u2192 Daily sales total, choose Add cost, enter sold-goods cost and its status, then save the existing record without duplicating revenue."],["\u8FDB\u8D27\u4E0D\u7B49\u4E8E\u5356\u51FA\u6210\u672C","Buying stock is not sold-goods cost","\u8FDB 100 \u74F6\uFF0C\u53EA\u5356 20 \u74F6\uFF0C\u53EA\u6263\u8FD9 20 \u74F6\u7684\u6210\u672C\u3002\u5269\u4E0B\u7684\u8FD8\u662F\u5E93\u5B58\u3002\u8FD9\u91CC\u8BB0\u5F55\u8FDB\u8D27\u4ED8\u6B3E\uFF0C\u4F46\u4E0D\u81EA\u52A8\u8BA1\u7B97\u5E93\u5B58\u6279\u6B21\u6216\u52A0\u6743\u6210\u672C\u3002\u8BF7\u4F9D\u636E\u5B9E\u9645\u5356\u51FA\u7684\u5546\u54C1\u586B\u5199\u6210\u672C\u3002","Buy 100 drinks but sell 20: only the cost of those 20 reduces profit. The rest is stock. Purchase payments are tracked separately; inventory batches and weighted costs are not calculated automatically. Enter the cost of goods actually sold."],["\u4E3A\u4EC0\u4E48\u5229\u6DA6\u8FD8\u662F\u4F30\u8BA1\uFF1F","Why is profit still estimated?","\u5DF2\u8BB0\u5F55\u51C0\u5229\u6DA6\u8981\u6C42\u65E5\u671F\u6838\u5BF9\u5B8C\u6210\u3001\u6210\u672C\u4E0E\u8D39\u7528\u5747\u6838\u5B9E\u3002\u53C2\u8003\u6210\u672C\u3001\u4F30\u7B97\u8D26\u5355\u3001\u672A\u6838\u5B9E\u91D1\u989D\u6216\u672A\u6838\u5BF9\u65E5\u671F\u4F1A\u4F7F\u5229\u6DA6\u6807\u4E3A\u9884\u8BA1\u3002\u5B8C\u5168\u7F3A\u5931\u4E14\u65E0\u53C2\u8003\u6210\u672C\u65F6\uFF0C\u4E0D\u8BA1\u7B97\u5B8C\u6574\u5229\u6DA6\uFF1B\u4E0D\u4F1A\u628A\u672A\u77E5\u6210\u672C\u5F53\u6210\u96F6\u3002","Recorded net profit requires checked dates and verified costs and expenses. Reference costs, estimated bills, unverified amounts, or unchecked dates produce estimated profit. If a cost is missing and no reference exists, full profit is withheld. Unknown cost is never zero."],["\u6539\u4E86\u8BB0\u5F55\uFF0C\u8981\u91CD\u65B0\u6838\u5BF9","Changes require a fresh check","\u65B0\u589E\u3001\u4FEE\u6539\u3001\u5220\u9664\u3001\u5BFC\u5165\u548C\u64A4\u9500\u90FD\u4F1A\u6E05\u9664\u76F8\u5173\u65E5\u671F\u7684\u6838\u5BF9\u72B6\u6001\u3002\u4FEE\u6539\u9500\u552E\u65E5\u671F\u5F71\u54CD\u65B0\u65E7\u4E24\u5929\uFF1B\u4FEE\u6539\u8D39\u7528\u5F71\u54CD\u65B0\u65E7\u8986\u76D6\u8303\u56F4\uFF1B\u4FEE\u6539\u53C2\u8003\u6210\u672C\u5F71\u54CD\u4F7F\u7528\u5B83\u7684\u9500\u552E\u65E5\u671F\u3002\u6062\u590D\u5907\u4EFD\u4F1A\u6E05\u9664\u5168\u90E8\u6838\u5BF9\u72B6\u6001\u3002","Adding, editing, deleting, importing, and undoing clear affected checked dates. Moving a sale affects both dates; editing an expense affects both coverage ranges; changing reference cost affects sales using it. Restoring a backup clears all checked dates."],["\u6BCF\u5929\u548C\u6BCF\u6708\u7684\u8D39\u7528","Daily and monthly expenses","\u9009\u62E9\u300C\u53EA\u7B97\u5F53\u5929\u300D\u6216\u300C\u6574\u4E2A\u6708\u300D\uFF0C\u81EA\u52A8\u8BBE\u7F6E\u65E5\u671F\u3002\u6309\u5929\u5206\u644A\u5230\u5206\uFF0C\u9664\u4E0D\u5C3D\u7684\u51E0\u5206\u94B1\u5206\u5230\u6700\u524D\u9762\u7684\u65E5\u671F\uFF0C\u4FDD\u8BC1\u5408\u8BA1\u4E00\u81F4\u3002\u5B9E\u9645\u8D26\u5355\u5230\u4E86\uFF0C\u8BF7\u4FEE\u6539\u539F\u4F30\u7B97\uFF0C\u4E0D\u8981\u91CD\u590D\u65B0\u589E\u3002","Choose This day or Whole month to fill dates automatically. Expenses are allocated by day in integer cents; leftover cents go to the first days so totals reconcile. Edit estimated bills when actual figures arrive; do not add them twice."],["\u76F8\u540C\u4EA4\u6613\uFF0C\u4F1A\u88AB\u8BEF\u5220\u5417\uFF1F","Will identical transactions be discarded?","\u65E0\u4EA4\u6613\u7F16\u53F7\u7684\u76F8\u540C\u884C\u9ED8\u8BA4\u5168\u90E8\u4FDD\u7559\uFF0C\u7591\u4F3C\u91CD\u590D\u4F1A\u8BA9\u4F60\u786E\u8BA4\uFF0C\u53EF\u9010\u884C\u53D6\u6D88\u52FE\u9009\u3002\u5E26\u7F16\u53F7\u7684\u8BB0\u5F55\u53EA\u6709\u7F16\u53F7\u4E0E\u5185\u5BB9\u90FD\u76F8\u540C\u624D\u8DF3\u8FC7\uFF1B\u540C\u7F16\u53F7\u4E0D\u540C\u5185\u5BB9\u4F1A\u62A5\u9519\u3002\u5EFA\u8BAE\u7F16\u53F7\u542B\u6765\u6E90\uFF0C\u4F8B\u5982\u6536\u94F6\u673AA-001\u3002","Identical rows without IDs are kept, with a review prompt and individual checkboxes. Rows with IDs are skipped only when both ID and contents match. The same ID with different contents is an error. Use source-prefixed IDs such as till-A-001."],["\u5BFC\u5165\u7A7A\u767D\u72B6\u6001\u4E0D\u662F\u5DF2\u6838\u5B9E","Blank import status is Unverified","\u72B6\u6001\u7A7A\u767D\u7684\u5BFC\u5165\u6309\u300C\u672A\u6838\u5B9E\u300D\u4FDD\u5B58\u3002\u672A\u6838\u5B9E\u91D1\u989D\u53C2\u4E0E\u9884\u8BA1\u5229\u6DA6\uFF0C\u4F46\u4E0D\u8FDB\u5165\u5DF2\u6838\u5B9E\u90E8\u5206\u3002\u6838\u5BF9\u65E5\u671F\u4E0D\u4F1A\u6838\u5B9E\u91D1\u989D\uFF0C\u8BF7\u6838\u5BF9\u6765\u6E90\u540E\u7F16\u8F91\u539F\u8BB0\u5F55\u6539\u4E3A\u5DF2\u6838\u5B9E\u3002\u53D6\u6D88\u52FE\u9009\u7684\u884C\u53CA\u4EC5\u7528\u4E8E\u8FD9\u4E9B\u884C\u7684\u65B0\u5546\u54C1\u4E0D\u4F1A\u5BFC\u5165\u3002","Imported blank statuses become Unverified. These amounts contribute to estimated profit, not the verified portion. Checking dates does not verify amounts; review the source and edit the entry to Verified. Excluded rows and products used only by them are not imported."],["\u5168\u5E97\u6BCF\u6708\u8BD5\u7B97","Whole-shop monthly plan","\u9009\u4E0
